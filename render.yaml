# Infraestrutura no Render, versionada junto com o código.
#
# No painel: New → Blueprint → aponte para este repositório. O Render lê este
# arquivo e cria o serviço.
#
# O banco NÃO é criado aqui: a TREELE já usa um projeto no Supabase (Postgres
# gerenciado, plano gratuito) para outro sistema, com espaço sobrando (161 de
# 500 MB usados — conferido em 23/09/2026), e este sistema guarda só metadado —
# os arquivos ficam no R2, não no banco. Reaproveitar evita pagar um banco a
# mais. DATABASE_URL é preenchida no painel com a string do *Transaction
# pooler* do Supabase (porta 6543) — ver docs/render.md, passo 2.3.
#
# O que também NÃO está aqui são os segredos do armazenamento (Cloudflare R2).
# Eles são preenchidos uma vez no painel — ver docs/render.md.

services:
  - type: web
    name: treele
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/saude
    envVars:
      - key: DATABASE_URL
        sync: false
      # Schema próprio dentro do banco compartilhado: as tabelas deste sistema
      # não se misturam com as do outro app que já mora no "public".
      - key: DB_SCHEMA
        value: treele

      # Gerado pelo Render na criação e nunca mais mostrado. Assina as sessões
      # e os links de download.
      - key: SECRET_KEY
        generateValue: true

      - key: AMBIENTE
        value: producao
      - key: STORAGE_BACKEND
        value: s3

      # Cloudflare R2 — preencher no painel. O plano gratuito cobre 10 GB, mais
      # que o acervo inteiro, e não cobra tráfego de saída (que é o que pesa
      # quando a obra baixa modelo grande).
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: treele-projetos
      - key: S3_REGION
        value: auto

      # Primeiro acesso. Trocar a senha logo depois de entrar.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        generateValue: true

      - key: TAMANHO_MAX_MB
        value: "2048"
