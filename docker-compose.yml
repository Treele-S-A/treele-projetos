# Ambiente completo: Postgres + MinIO + API + web.
#
#   docker compose up --build
#
# Depois: http://localhost:8080 (sistema) e http://localhost:9001 (console MinIO).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: treele
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-treele}
      POSTGRES_DB: treele
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treele"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-treele}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-treele-minio-senha}
    ports:
      # A porta 9000 precisa ser alcançável pelo NAVEGADOR, não só pela API:
      # é para ela que vão os links pré-assinados de upload e download.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dados-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://treele:${POSTGRES_PASSWORD:-treele}@db:5432/treele
      STORAGE_BACKEND: s3
      S3_ENDPOINT: ${S3_ENDPOINT_PUBLICO:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-treele-projetos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-treele}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-treele-minio-senha}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@treele.com.br}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      AMBIENTE: ${AMBIENTE:-producao}
      TAMANHO_MAX_MB: ${TAMANHO_MAX_MB:-2048}
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API: ${BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  dados-postgres:
  dados-minio:
